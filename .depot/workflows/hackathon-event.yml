name: Webhook test

on:
  repository_dispatch:
    types: [demo.received]
    webhook: demo

jobs:
  show_event:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Print the received event
        env:
          EVENT_TYPE: ${{ github.event.action }}
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          printf 'Event type = %s\n' "$EVENT_TYPE"
          printf 'Message = %s\n' "$MESSAGE"
